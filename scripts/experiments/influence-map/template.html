<title>Kynda Influence Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one full-screen map; a slim top bar holds the trail and controls; quotes float over the map on hover or hold. */
/* Kynda's own tokens (src/design/tokens.js). The product is dark-only, so this page commits to that one look. */
:root {
  --bg: #0f1016;
  --surface: #161821;
  --surface-2: #1c1f2b;
  --line: rgba(148,163,184,0.16);
  --fg: #e2e8f0;
  --muted: rgba(148,163,184,0.7);
  --faint: rgba(148,163,184,0.42);
  --gold: #facc15;
  --pred: #a8c8d8;
  --peer: #e04040;
  --succ: #8844cc;
  --succ-text: #b48ae6;
  --display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 3; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.55rem; line-height: 1; white-space: nowrap; }
.brand .tag { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

.trail { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; font-family: var(--mono); font-size: 0.72rem; }
.trail::-webkit-scrollbar { display: none; }
.trail button { flex: none; background: none; border: 0; padding: 4px 6px; border-radius: 4px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
.trail button:hover { color: var(--fg); background: var(--surface-2); }
.trail button[aria-current="true"] { color: var(--gold); }
.trail .sep { color: var(--faint); flex: none; }

.controls { display: flex; align-items: center; gap: 8px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
.ctl:hover { color: var(--fg); border-color: rgba(148,163,184,0.35); }
.ctl[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.ctl:focus-visible, .trail button:focus-visible, .card a:focus-visible, .card button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ctl svg { width: 13px; height: 13px; }

.stage { position: relative; flex: 1; min-height: 0; }
#web { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(0,0,0,.5) 0%, #000 85%);
          mask-image: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(0,0,0,.5) 0%, #000 85%); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map:active { cursor: grabbing; }

.legend { position: absolute; left: 20px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.keybtn { display: none; position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2; }
.legend .mixkey { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; }
.legend .mixkey:empty { display: none; }
.legend .ringdot { width: 9px; height: 9px; background: none; border: 2px solid; box-sizing: border-box; }
.legend .mixkey b { font-weight: 500; color: var(--fg); }
.hint { position: absolute; right: 20px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono); font-size: 0.64rem; color: var(--faint); text-align: right; pointer-events: none; }

.subject-tag { position: absolute; left: 20px; top: 16px; max-width: min(420px, calc(100% - 40px)); pointer-events: none; }
.subject-tag .eyebrow { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.subject-tag .count { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* Nodes */
.node { cursor: pointer; }
.node:active { cursor: grabbing; }
.node.dead { cursor: default; }
.node .disc { transition: fill-opacity .25s; }
.node .ring { fill: none; }
.node .pic { opacity: 0; transition: opacity .35s; pointer-events: none; }
.pics-on .node .pic { opacity: 1; }
.pics-on .node.has-pic .ring { stroke-width: 2.5px; stroke-opacity: 1; }
.node .initials { font-family: var(--mono); font-size: 10px; fill: var(--bg); text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: opacity .3s; }
.pics-on .node.has-pic .initials { opacity: 0; }
.node .label { font-family: var(--body); font-size: 11px; fill: rgba(226,232,240,0.86); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node .sub { font-family: var(--mono); font-size: 9px; fill: var(--faint); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
.node.center .label { font-family: var(--display); font-size: 19px; fill: var(--fg); }
.node.center { cursor: grab; }
.node.mix .label { font-size: 12.5px; font-weight: 600; fill: var(--fg); }
.node:hover .disc, .node.hot .disc { fill-opacity: 1; }
.node:focus { outline: none; }
.node:focus-visible .ring { stroke: var(--gold); stroke-width: 2.5; }
.edge { fill: none; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: help; }
.dim .node:not(.hot):not(.center) { opacity: .35; }
.dim .edge:not(.hot) { opacity: .25; }

/* Quote card */
.card { box-sizing: border-box; max-height: calc(100% - 32px); overflow-y: auto; position: absolute; z-index: 5; width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); padding: 16px 18px 14px; opacity: 0; transform: translateY(4px); transition: opacity .16s, transform .16s; pointer-events: none; }
.card.open { opacity: 1; transform: none; pointer-events: auto; }
.card .kind { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; }
.card h2 { margin: 6px 0 2px; font-family: var(--display); font-weight: 400; font-size: 1.35rem; line-height: 1.15; text-wrap: balance; }
.card .meta { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
.card .summary { margin: 10px 0 0; font-size: 0.84rem; line-height: 1.5; color: rgba(226,232,240,0.82); }
.card blockquote { margin: 12px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--line); font-family: var(--display); font-style: italic; font-size: 1.02rem; line-height: 1.45; color: var(--fg); }
.card cite { display: block; margin-top: 6px; font-family: var(--mono); font-style: normal; font-size: 0.64rem; color: var(--faint); }
.card cite a { color: var(--muted); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 0.64rem; color: var(--faint); }
.card .go { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 4px 10px; font: inherit; cursor: pointer; }
.card .go:hover { border-color: var(--gold); color: var(--gold); }
.card .x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; display: none; }
.card.touch .x { display: block; }

.toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -8px); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--fg); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 6; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1240px) { .hint { display: none; } }
@media (max-width: 640px) {
  .bar { padding: 10px 16px; gap: 8px 12px; }
  .brand .tag { display: none; }
  .brand h1 { font-size: 1.3rem; }
  .bar { flex-wrap: wrap; row-gap: 4px; }
  .trail { order: 3; flex: 1 1 100%; margin-left: -6px; }
  .controls { order: 2; margin-left: auto; gap: 6px; }
  .ctl { padding: 0; width: 32px; justify-content: center; }
  .ctl .lbl { display: none; }
  .subject-tag .eyebrow { display: none; }
  .keybtn { display: inline-flex; }
  .legend { display: none; flex-direction: column; gap: 8px; font-size: 0.62rem; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 2; pointer-events: auto; }
  .legend.open { display: flex; }
  .legend .mixkey { flex-direction: column; gap: 8px; }
  .hint { display: none; }
  .legend { left: 16px; }
  .subject-tag { left: 16px; top: 10px; }
  .card { left: 16px !important; right: 16px; top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>Kynda</h1><span class="tag">Influence map · prototype</span></div>
    <nav class="trail" id="trail" aria-label="Your path"></nav>
    <div class="controls">
      <button class="ctl" id="pics" aria-pressed="false" title="Show a picture inside each circle">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="7" r="1.3"/><path d="M3 12l3.5-3.5 2.5 2.5 2-2 2.5 2.5"/></svg><span class="lbl">Pictures</span></button>
      <button class="ctl" id="replay" title="Build this map again">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2.5V5h2.5"/></svg><span class="lbl">Replay</span></button>
      <button class="ctl" id="copy" title="Copy your path as text" aria-label="Copy path"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg><span class="lbl">Copy path</span></button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="web" aria-hidden="true"></canvas>
    <svg id="map" role="img" aria-label="Influence map"></svg>
    <div class="subject-tag"><div class="eyebrow">Mapping</div><div class="count" id="count"></div></div>
    <button class="ctl keybtn" id="keybtn" aria-expanded="false" aria-controls="legend">Key</button>
    <div class="legend" id="legend">
      <span><i style="background:var(--pred)"></i>Influences</span>
      <span><i style="background:var(--peer)"></i>Peers &amp; partners</span>
      <span><i style="background:var(--succ)"></i>Successors</span>
      <span class="mixkey" id="mixkey"></span>
      <span><i style="background:none;border:1px dashed var(--faint)"></i>Not mapped yet</span>
    </div>
    <div class="hint" id="hint">Hover for the evidence · click to travel · drag a bubble to tug it · scroll to zoom</div>
    <div class="card" id="card" role="dialog" aria-live="polite"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const GRAPHS = /*__DATA__*/;
const THUMBS = /*__THUMBS__*/;
const MIXES = /*__MIXES__*/;
const MIX_THUMBS = /*__MIX_THUMBS__*/;
const ROOT = "Kurt Vonnegut";

const COLORS = { predecessor: "#a8c8d8", peer: "#e04040", successor: "#8844cc", canon: "#d4a72c" };
const TEXT_COLORS = { predecessor: "#a8c8d8", peer: "#f07070", successor: "#b48ae6", canon: "#facc15" };
const TYPE_LABEL = { predecessor: "Influence", peer: "Peer or partner", successor: "Successor", canon: "Their own work" };
// KyndaMix slot vocabulary and colors, from src/design/tokens.js.
const SLOTS = {
  titan: ["Key Influence", "#ff8c32", "predecessor"], ghost: ["Influencia Obscura", "#94a3b8", "predecessor"],
  geography: ["Local Roots", "#38bdf8", "peer"], culture: ["Beyond the Medium", "#a855f7", "predecessor"],
  peer: ["Peer", "#fb7185", "peer"], essential: ["From the Canon", "#facc15", "canon"],
  legacy: ["Legacy", "#34d399", "successor"], collaborator: ["Key Collaborator", "#818cf8", "peer"],
  covers: ["Covered Them", "#2dd4bf", "predecessor"], covered_by: ["Covered By", "#e879f9", "successor"],
};
const CLAIM_LABELS = {
  influenced_by: "influence", cited_as_influence: "cited influence", cross_medium_influence: "cross-medium influence",
  same_scene: "shared scene", collaborated_with: "collaboration", produced_by: "production", member_of: "membership",
  covers: "cover", covered_by: "covered by", used_gear: "gear", recorded_at: "recorded at", founded: "founded",
  taught_at: "taught at", studied_under: "studied under", created_by: "created by",
};
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg = d3.select("#map");
const defs = svg.append("defs");
defs.append("clipPath").attr("id", "circ").attr("clipPathUnits", "objectBoundingBox")
  .append("circle").attr("cx", .5).attr("cy", .5).attr("r", .5);
const glow = defs.append("filter").attr("id", "glow").attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
glow.append("feGaussianBlur").attr("stdDeviation", 6).attr("result", "b");
const fm = glow.append("feMerge"); fm.append("feMergeNode").attr("in", "b"); fm.append("feMergeNode").attr("in", "SourceGraphic");

const world = svg.append("g");
const gTrail = world.append("g");
const gEdges = world.append("g");
const gHits = world.append("g");
const gNodes = world.append("g");
const zoom = d3.zoom().scaleExtent([0.25, 4]).on("zoom", (e) => { world.attr("transform", e.transform); webView = e.transform; });
svg.call(zoom).on("dblclick.zoom", null);

const live = new Map();     // name -> node object currently on screen (incl. exiting)
let center = ROOT;
let trail = [ROOT];
let trailPos = 0;
let anim = null;

const short = (s, n = 24) => (s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s);
const initials = (s) => s.replace(/^(The|A|An) /, "").split(/\s+/).filter((w) => /^[A-Z0-9]/.test(w)).slice(0, 2).map((w) => w[0]).join("") || s[0];
// Size: anything in the KyndaMix is a headliner; everything else scales with its evidence.
const radius = (n) => n.mix ? 36 + Math.min(n.weight || 4, 10) * 1.2 : 9 + Math.min(n.weight || 0, 10) * 2.4;
const CENTER_R = 54;
const normT = (s) => String(s || "").toLowerCase().replace(/^(the|a|an) /, "").replace(/[^a-z0-9]+/g, " ").trim();
const picOf = (d) => (d.mix && MIX_THUMBS[d.name]) || THUMBS[d.name] || null;

function neighbors(name) {
  const g = GRAPHS[name]; if (!g) return [];
  const seen = new Set([name.toLowerCase()]); const out = [];
  const groups = [["predecessors", "predecessor"], ["peers", "peer"], ["successors", "successor"]];
  for (const [key, type] of groups) {
    const items = [...(g[key] || [])].sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999) || b.weight - a.weight);
    for (const it of items) {
      const k = it.name.toLowerCase(); if (seen.has(k)) continue; seen.add(k);
      out.push({ ...it, type });
    }
  }
  const byTitle = new Map(out.map((n) => [normT(n.name), n]));
  for (const c of MIXES[name] || []) {
    if (c.slotType === "essential") continue; // their own canon stays off the map
    const slot = SLOTS[c.slotType] || ["In the mix", "#facc15", "predecessor"];
    let n = byTitle.get(normT(c.title));
    if (!n) {
      // Mix cards the claims graph doesn't hold yet (the subject's own canon, mainly) still belong on the map.
      n = { name: c.title, creator: c.creator, year: c.year, type: slot[2], weight: 4, evidence: [], tier: "in the mix" };
      out.push(n); byTitle.set(normT(c.title), n);
    }
    n.mix = { slot: c.slotType, label: slot[0], color: slot[1], reason: c.reason };
  }
  const rank = (n) => (n.type === "canon" ? 0 : n.mix ? 1 : 2);
  const typeOrder = { canon: 0, predecessor: 1, peer: 2, successor: 3 };
  return out.sort((a, b) => rank(a) - rank(b) || typeOrder[a.type] - typeOrder[b.type] || (a.year ?? 9999) - (b.year ?? 9999));
}

function size() { const r = svg.node().getBoundingClientRect(); return { w: r.width, h: r.height }; }

// Settle a static layout for one subject, seeded from where things are now so persisting nodes barely move.
function layout(name) {
  const { w, h } = size();
  const narrow = w < 640;
  const span = narrow ? Math.max(h, 600) * 0.42 : Math.max(w, 900) * 0.36;
  const rand = d3.randomLcg(name.length * 7919 + 13);
  const old = live.get(name);
  const nodes = [{ name, type: "center", r: CENTER_R, fx: 0, fy: 0 }];
  let peerI = 0;
  for (const n of neighbors(name)) {
    const prev = live.get(n.name);
    const t = n.type === "predecessor" ? -1 : n.type === "successor" ? 1 : 0;
    const node = { ...n, r: radius(n), t, side: n.type === "peer" ? (peerI++ % 2 ? 1 : -1) : 0 };
    const ox = old && prev ? prev.x - old.x : null, oy = old && prev ? prev.y - old.y : null;
    if (narrow) { node.x = ox ?? (rand() - .5) * 260; node.y = oy ?? t * span + (rand() - .5) * 140; }
    else { node.x = ox ?? t * span + (rand() - .5) * 160; node.y = oy ?? (rand() - .5) * 360; }
    nodes.push(node);
  }
  const links = nodes.slice(1).map((n) => ({ source: nodes[0], target: n }));
  const sim = d3.forceSimulation(nodes).stop()
    .force("link", d3.forceLink(links).distance((l) => l.target.type === "canon" ? CENTER_R + l.target.r + 40 : 120 + l.target.r).strength((l) => l.target.type === "canon" ? 0.6 : 0.04))
    .force("charge", d3.forceManyBody().strength(-70))
    .force("collide", d3.forceCollide((d) => d.r + (d.type === "center" ? 34 : d.mix ? 34 : 26)).strength(0.9).iterations(2));
  if (narrow) {
    sim.force("y", d3.forceY((d) => (d.t || 0) * span).strength((d) => (d.type === "peer" ? 0.1 : 0.14)))
       .force("x", d3.forceX((d) => (d.side || 0) * 150).strength((d) => (d.type === "peer" ? 0.12 : 0.05)));
  } else {
    sim.force("x", d3.forceX((d) => (d.t || 0) * span).strength((d) => (d.type === "peer" ? 0.12 : 0.14)))
       .force("y", d3.forceY((d) => (d.side || 0) * 230).strength((d) => (d.type === "peer" ? 0.12 : 0.04)));
  }
  for (let i = 0; i < 320; i++) sim.tick();
  return nodes;
}

function edgePath(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const sx = a.x + ux * a.cr, sy = a.y + uy * a.cr, tx = b.x - ux * b.cr, ty = b.y - uy * b.cr;
  const bend = Math.min(40, len * 0.12);
  return `M${sx},${sy}Q${(sx + tx) / 2 - uy * bend},${(sy + ty) / 2 + ux * bend} ${tx},${ty}`;
}

// Move to a subject: lay it out, then run one animation that exits, moves and builds nodes.
function go(name, { push = true, build = true } = {}) {
  if (!GRAPHS[name]) { toast(`Kynda hasn't mapped ${name} yet.`); return; }
  hideCard(true);
  if (wobble) { wobble.stop(); wobble = null; grabbed = null; for (const n of live.values()) { n.fx = n.fy = null; n.vx = n.vy = 0; } }
  const prevCenter = center;
  if (push && name !== center) { trail = trail.slice(0, trailPos + 1); trail.push(name); trailPos = trail.length - 1; }
  center = name;
  const target = layout(name);
  const keep = new Set(target.map((n) => n.name));
  const anchor = live.get(name) || { x: 0, y: 0 };
  const now = performance.now();

  // Shift the whole layout so the new center lands where its node already sits, then let the camera follow.
  const shift = { x: anchor.x || 0, y: anchor.y || 0 };
  let buildIdx = 0;
  const firstBuild = live.size === 0 || !build;
  target.forEach((t) => {
    const x1 = t.x + shift.x, y1 = t.y + shift.y;
    let n = live.get(t.name);
    if (n) {
      Object.assign(n, t, { x0: n.cx, y0: n.cy, x1, y1, s0: n.cs, s1: 1, cr0: n.ccr, r1: t.r, delay: 0, dur: 700, exiting: false });
    } else {
      const order = t.type === "center" ? 0 : ++buildIdx;
      n = { ...t, cx: anchor.x || 0, cy: anchor.y || 0, cs: 0, ccr: t.r,

      const along = (x * 0.8 + y * 0.6) - front, band = Math.exp(-(along * along) / (2 * 230 * 230));
      y += z * 8 - band * 14;
      P[a * rows + b] = [x, y, (z + 1.6) / 3.2 * 0.8 + band * 0.6];
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const paths = Array.from({ length: BUCKETS }, () => new Path2D());
    const seg = (p, q) => { const l = Math.min(BUCKETS - 1, Math.max(0, Math.floor(((p[2] + q[2]) / 2) * BUCKETS))); paths[l].moveTo(p[0], p[1]); paths[l].lineTo(q[0], q[1]); };
    for (let a = 0; a < cols - 1; a++) for (let b = 0; b < rows - 1; b++) {
      const i = i0 + a, j = j0 + b, p = P[a * rows + b];
      if (hash(i, j, 4) > 0.12) seg(p, P[(a + 1) * rows + b]);
      if (hash(i, j, 5) > 0.12) seg(p, P[a * rows + b + 1]);
      if (hash(i, j, 6) > 0.3) { if (hash(i, j, 7) > .5) seg(p, P[(a + 1) * rows + b + 1]); else seg(P[(a + 1) * rows + b], P[a * rows + b + 1]); }
    }
    ctx.lineWidth = 0.6;
    for (let l = 0; l < BUCKETS; l++) { ctx.strokeStyle = `rgba(148,163,184,${0.022 + l * 0.026})`; ctx.stroke(paths[l]); }
    for (let a = 0; a < cols; a++) for (let b = 0; b < rows; b++) {
      const p = P[a * rows + b], big = hash(i0 + a, j0 + b, 9) > 0.93;
      ctx.fillStyle = `rgba(168,200,216,${Math.min(0.5, (big ? 0.12 : 0.06) + p[2] * (big ? 0.22 : 0.12))})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], big ? 1.5 : 0.8, 0, 6.283); ctx.fill();
    }
  }
  if (REDUCED) { frame(0); zoom.on("zoom.web", () => frame(0)); return; }
  frame(performance.now());
  let last = 0;
  (function loop(t) { if (!document.hidden && t - last > 33) { last = t; frame(t); } requestAnimationFrame(loop); })(0);
})();
</script>
